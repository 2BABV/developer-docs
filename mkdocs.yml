site_name: Developer Documentation
site_url: https://developers.2ba.nl
site_description: Developer documentation for 2BA APIs and integration capabilities.
site_author: 2BA BV

repo_name: 2BABV/developer-docs
repo_url: https://github.com/2BABV/developer-docs
edit_uri: edit/main/docs/

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  font: false
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - toc.follow

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

nav:
  - Home: index.md
  - OAuth2 / Identity:
    - Introduction: oauth2/index.md
    - Resource Owner Password Credentials Grant: oauth2/oauth2-resource-owner-password-credentials-grant.md
    - Authorization Code: oauth2/oauth2-authorization-code.md
    - Refresh Access Token: oauth2/oauth2-refresh-access-token.md
  - 2BA WCF API:
    - Introduction: api/wcf-introduction.md
    - Error Codes: api/wcf-error-codes.md
    - Example - JSON Service Request: api/wcf-example-json-request.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/2BABV
  generator: false

copyright: Copyright &copy; 2026 2BA BV
